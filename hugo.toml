[[menu.main]]
  name = "Napsat Tyfovi"
  url = "/kontakt/"
  weight = 60

[[menu.main]]
name = "Hledat"
url = "/search/"
weight = 50
[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  identifier = "archives"
  name = "Archiv"
  url = "/archives/"
  weight = 60

ignoreLogs = ['warning-goldmark-raw-html']

[outputs]
  home = ["HTML", "RSS", "JSON"]
